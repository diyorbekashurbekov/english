<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<title>Super U</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@300;500;600;700;800&display=swap">
<style>
/* Layout: an Apple-style product page that turns into a keynote. The landing page scrolls (black hero, white lessons, grey teams, white specs). A lesson is full-screen scenes, one idea per screen, driven with the arrow keys. */
:root{
  --snow:#fbfbfd; --white:#ffffff; --mist:#f5f5f7; --mist-2:#ebebef; --line:#d2d2d7;
  --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#86868b;
  --night:#000000; --night-2:#1c1c1e; --night-3:#2c2c2e; --moon:#f5f5f7; --moon-2:#a1a1a6;
  --blue:#0071e3; --blue-2:#2997ff; --green:#30d158; --green-ink:#1d7a35; --red:#ff453a; --red-ink:#c4161c;
  --sepia:#f3e8d2; --sepia-ink:#4a3818;
  --g-brand:linear-gradient(90deg,#0894ff 0%,#c959dd 34%,#ff2e54 68%,#ff9004 100%);
  --g-power:linear-gradient(90deg,#ff9004,#ff2e54);
  --g-time:linear-gradient(90deg,#2997ff,#a95cff);
  --g-connect:linear-gradient(90deg,#00c7be,#30d158);
  --g:var(--g-brand);
  --f-display:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Inter Tight","Inter","Segoe UI",Roboto,sans-serif;
  --f-text:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--snow);color:var(--ink);font-family:var(--f-text);font-size:17px;line-height:1.47;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:rgba(251,251,253,.9)}
button,input,select{font:inherit;color:inherit}
select{border:0;background:var(--mist);border-radius:12px;padding:11px 14px;font-size:16px;font-weight:500;cursor:pointer}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--blue-2);outline-offset:3px;border-radius:10px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.hl,.grad{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.kk{display:none}
.kk-on .kk{display:block;color:var(--ink-3);font-weight:500;margin-top:.45em;font-size:.9em}
.dark .kk-on .kk,.kk-on .dark .kk{color:var(--moon-2)}
.muted{color:var(--ink-2)}

/* Buttons */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:12px 24px;font-size:17px;font-weight:500;background:var(--blue);color:#fff;transition:background .2s,transform .2s var(--ease);white-space:nowrap}
.pill:hover{background:#0077ed}
.pill:active{transform:scale(.97)}
.pill.sm{padding:7px 15px;font-size:14px}
.pill.light{background:#fff;color:#000}
.pill.light:hover{background:#e8e8ed}
.pill.dark{background:var(--ink);color:#fff}
.link{color:var(--blue);font-size:17px;font-weight:500;white-space:nowrap}
.link::after{content:"\00a0›"}
.link:hover{text-decoration:underline}
.on-dark .link{color:var(--blue-2)}
.tog{font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;background:rgba(120,120,128,.14);line-height:1;letter-spacing:.02em}
.tog[aria-pressed="true"]{background:var(--ink);color:#fff}
.on-dark .tog[aria-pressed="true"],.deck.dark .tog[aria-pressed="true"]{background:#fff;color:#000}

/* Landing */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(251,251,253,.78);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.07)}
.nav .wrap{height:52px;display:flex;align-items:center;gap:22px}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.035em}
.nav a{font-size:13px;color:var(--ink);text-decoration:none;opacity:.8}
.nav a:hover{opacity:1}
.nav .sp{flex:1}
@media (max-width:640px){.nav .links{display:none}}
.hero{background:#000;color:var(--moon);text-align:center;padding-block:clamp(64px,11vh,120px) clamp(64px,10vh,110px);position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:18px}
.eyebrow{font-size:clamp(15px,1.5vw,21px);font-weight:600;color:var(--ink-2);letter-spacing:-.012em}
.on-dark .eyebrow,.deck.dark .eyebrow{color:var(--moon-2)}
.hero h1{font-size:clamp(76px,15vw,190px);letter-spacing:-.05em;line-height:.92;padding-bottom:.06em;background:var(--g-brand);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1.3s var(--ease) both}
.hero .lede{color:var(--moon);font-size:clamp(22px,2.8vw,36px);font-weight:600;letter-spacing:-.025em;animation:rise 1.3s .15s var(--ease) both}
.hero .row{display:flex;gap:26px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:10px;animation:rise 1.3s .3s var(--ease) both}
.glow{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;opacity:.42}
.chips{display:flex;gap:clamp(16px,3.4vw,40px);justify-content:center;flex-wrap:wrap;margin-top:clamp(40px,7vh,80px)}
.chip3d{--s:clamp(118px,15vw,188px);width:var(--s);height:var(--s);border-radius:calc(var(--s)*.22);background:linear-gradient(150deg,#2a2a2e 0%,#0b0b0d 62%);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s)*.03);box-shadow:0 40px 90px -36px var(--glow,rgba(255,255,255,.25)),inset 0 1px 0 rgba(255,255,255,.07);transition:transform .6s var(--ease),filter .6s;color:var(--moon);animation:rise 1.4s var(--d,.45s) var(--ease) both}
.chip3d::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:var(--g);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.chip3d::after{content:"";position:absolute;inset:9%;border-radius:calc(var(--s)*.14);border:1px dashed rgba(255,255,255,.08)}
.chip3d .brand{font-size:calc(var(--s)*.068);letter-spacing:.22em;color:var(--moon-2);font-weight:600}
.chip3d .lbl{font-family:var(--f-display);font-weight:700;font-size:calc(var(--s)*.2);letter-spacing:-.035em;line-height:1;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip3d .sub{font-size:calc(var(--s)*.074);color:var(--moon-2);font-weight:500}
.chip3d.off{filter:saturate(.15) brightness(.75)}
.chip3d:hover{transform:translateY(-6px)}
.sec{padding-block:clamp(72px,11vh,124px)}
.sec.grey{background:var(--mist)}
.sec-title{font-size:clamp(42px,6.4vw,80px);letter-spacing:-.04em;line-height:1.04;text-align:center}
.sec-lede{text-align:center;color:var(--ink-2);font-size:clamp(19px,2vw,26px);font-weight:500;letter-spacing:-.02em;max-width:40ch;margin:16px auto 0}
.lcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:52px}
@media (max-width:900px){.lcards{grid-template-columns:minmax(0,1fr)}}
.lcard{background:#000;color:var(--moon);border-radius:30px;padding:34px 30px 30px;display:flex;flex-direction:column;gap:10px;min-height:460px;position:relative;overflow:hidden}
.lcard>*{position:relative;z-index:1}
.lcard>.glow{position:absolute;z-index:0;width:340px;height:340px;bottom:-170px;right:-120px;opacity:.55}
.lcard h3{font-size:clamp(50px,5.4vw,66px);letter-spacing:-.045em;line-height:1}
.lcard .sub{font-size:19px;font-weight:600;letter-spacing:-.02em}
.lcard .meta{color:var(--moon-2);font-size:15px}
.lcard .chip3d{--s:112px;margin:18px 0 8px;animation:none}
.lcard .actions{margin-top:auto;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(120,120,128,.14);border-radius:11px;padding:3px}
.seg button{padding:7px 18px;border-radius:9px;font-weight:600;font-size:15px;color:var(--ink-2);transition:all .25s var(--ease)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.12)}
.tsetup{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:center;margin-top:34px}
.tsetup label{font-size:15px;font-weight:600;color:var(--ink-2)}
.tsetup input{border:0;border-bottom:1px solid var(--line);background:transparent;font-size:19px;font-weight:600;padding:4px 2px;width:180px;letter-spacing:-.02em}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:30px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:50px}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{background:var(--mist);border-radius:28px;padding:28px 24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.step-n{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--ink-3)}
.step-ic{font-size:44px;line-height:1;font-family:var(--f-display);font-weight:700}
.step h3{font-size:24px;letter-spacing:-.03em}
.step p{color:var(--ink-2);font-size:16px}
.keys{display:flex;flex-wrap:wrap;gap:12px 26px;justify-content:center;margin-top:30px;color:var(--ink-2);font-size:15px}
.keys span{display:inline-flex;align-items:center;gap:8px}
kbd{font-family:var(--f-text);font-weight:600;font-size:14px;min-width:30px;height:30px;padding:0 8px;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--line),0 2px 0 var(--line);display:inline-grid;place-items:center;color:var(--ink)}
.hint{flex:none;display:flex;justify-content:center;align-items:center;gap:8px;margin:0 auto;padding:8px 18px;border-radius:999px;background:rgba(120,120,128,.12);font-size:clamp(14px,1.35vw,18px);font-weight:500;color:var(--ink);max-width:min(1000px,calc(100% - 40px));text-align:center;line-height:1.35;animation:rise .5s var(--ease) both}
.hint:empty{display:none}
.hint .bulb{flex:none}
.deck.dark .hint{color:var(--moon);background:rgba(255,255,255,.1)}
.tcard{background:var(--mist);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tcard .em{font-size:38px;line-height:1}
.tcard input{border:0;border-bottom:1px solid var(--line);font-size:22px;font-weight:600;padding:4px 0;background:transparent;width:100%;letter-spacing:-.025em;min-width:0}
.tcard .score{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.specs{margin-top:46px;overflow-x:auto}
.specs table{border-collapse:collapse;width:100%;min-width:640px}
.specs th,.specs td{text-align:left;vertical-align:top;padding:18px 16px 18px 0;border-top:1px solid var(--line);font-size:16px}
.specs th{font-weight:600;color:var(--ink-2);width:150px}
.specs thead th{border-top:0;font-family:var(--f-display);font-size:28px;letter-spacing:-.03em;color:var(--ink)}
.specs td b{display:block;font-family:var(--f-display);font-size:24px;letter-spacing:-.03em}
.foot{padding-block:28px 40px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.foot button{color:var(--blue);font-size:12px}

/* Deck */
.deck{position:fixed;inset:0;z-index:100;background:var(--snow);color:var(--ink);display:flex;flex-direction:column;transition:background .7s var(--ease),color .7s var(--ease)}
.deck.dark{background:#000;color:var(--moon)}
.dtop{flex:none;display:flex;align-items:center;gap:14px;padding:calc(12px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 8px max(20px,env(safe-area-inset-left,0px));min-height:56px}
.dtop .wordmark{font-size:19px}
.dtop .ttl{font-size:14px;color:var(--ink-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck.dark .ttl{color:var(--moon-2)}
@media (max-width:700px){.dtop .ttl{display:none}}
.sb{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.sbi{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:rgba(120,120,128,.14);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.sbi.bump{animation:bump .7s var(--ease)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.dstage{flex:1;position:relative;overflow:hidden}
.scene{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:clamp(10px,2.5vh,36px) max(22px,env(safe-area-inset-right,0px)) clamp(14px,3vh,40px) max(22px,env(safe-area-inset-left,0px));animation:sceneIn .8s var(--ease) both}
.scene.leaving{animation:sceneOut .45s var(--ease) both;pointer-events:none}
.inner{margin:auto 0;width:100%;max-width:1120px;display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.6vh,30px);text-align:center}
.dbot{flex:none;display:flex;align-items:center;gap:16px;padding:8px max(20px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.prog{flex:1;display:flex;gap:4px;align-items:center;min-width:0}
.prog button{flex:1;height:14px;display:flex;align-items:center}
.prog button i{display:block;width:100%;height:4px;border-radius:2px;background:rgba(120,120,128,.25);transition:background .4s}
.prog button.done i{background:rgba(120,120,128,.6)}
.prog button.cur i{background:var(--g)}
.count{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.nbtn{width:46px;height:46px;border-radius:50%;background:rgba(120,120,128,.16);display:grid;place-items:center;font-size:20px;flex:none;transition:transform .2s var(--ease)}
.nbtn:active{transform:scale(.92)}
.nbtn.main{background:var(--ink);color:#fff}
.deck.dark .nbtn.main{background:#fff;color:#000}

/* Scene type */
.display{font-size:clamp(56px,10vw,140px);letter-spacing:-.05em;line-height:.98;padding-bottom:.05em}
.headline{font-size:clamp(36px,5.6vw,76px);letter-spacing:-.042em;line-height:1.04}
.big{font-family:var(--f-display);font-size:clamp(34px,6vw,92px);font-weight:700;letter-spacing:-.042em;line-height:1.08}
.mid{font-family:var(--f-display);font-size:clamp(26px,3.7vw,50px);font-weight:600;letter-spacing:-.032em;line-height:1.16}
.small-q{font-family:var(--f-display);font-size:clamp(22px,2.9vw,38px);font-weight:600;letter-spacing:-.025em;line-height:1.2}
.lede{font-size:clamp(19px,2.1vw,30px);font-weight:500;color:var(--ink-2);letter-spacing:-.018em;line-height:1.3;max-width:38ch}
.deck.dark .lede{color:var(--moon-2)}
.note{font-size:clamp(17px,1.8vw,24px);color:var(--ink-2);font-weight:500;letter-spacing:-.015em;max-width:52ch}
.deck.dark .note{color:var(--moon-2)}
.gap{display:inline-block;min-width:2.4em;border-bottom:.07em solid currentColor;opacity:.45;margin:0 .1em;line-height:1}
.gap.fill{opacity:1;border-color:transparent;min-width:0;animation:pop .5s var(--ease)}
.say{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(120,120,128,.14);font-size:18px;vertical-align:middle;flex:none;transition:transform .2s var(--ease)}
.say:hover{transform:scale(1.08)}
.lines{display:flex;flex-direction:column;align-items:center;gap:.18em}
.lines>*{animation:rise .9s var(--ease) both}
.beats{display:flex;gap:8px;justify-content:center}
.beats i{width:8px;height:8px;border-radius:50%;background:rgba(120,120,128,.3);transition:all .4s var(--ease)}
.beats i.on{width:26px;border-radius:4px;background:var(--ink)}
.deck.dark .beats i.on{background:#fff}
.card{background:var(--mist);border-radius:30px;padding:clamp(20px,3vw,38px)}
.deck.dark .card{background:var(--night-2)}

/* Quiz */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;width:100%;max-width:1040px}
.opt{display:flex;align-items:center;gap:16px;text-align:left;padding:clamp(14px,2.1vh,24px) 22px;border-radius:24px;background:var(--mist);font-size:clamp(18px,2.1vw,28px);font-weight:600;letter-spacing:-.022em;line-height:1.25;transition:transform .35s var(--ease),background .35s,opacity .35s,box-shadow .35s}
.opt:hover{transform:scale(1.015)}
.opt .L{flex:none;width:clamp(32px,3vw,42px);height:clamp(32px,3vw,42px);border-radius:50%;background:#fff;display:grid;place-items:center;font-size:.68em;font-weight:700;color:var(--ink-2);transition:all .35s}
.opt.right{background:#dff6e5;box-shadow:inset 0 0 0 2.5px var(--green)}
.opt.right .L{background:var(--green);color:#fff}
.opt.wrong{background:#ffe4e2;box-shadow:inset 0 0 0 2.5px var(--red)}
.opt.wrong .L{background:var(--red);color:#fff}
.opt.dim{opacity:.3;transform:scale(.985)}
.opt.dim,.opt.right,.opt.wrong{animation:none!important}
.opt .tagw{margin-left:auto;font-size:.6em;font-weight:600;color:var(--red-ink);white-space:nowrap}
.deck.dark .opt{background:var(--night-2);color:var(--moon)}
.deck.dark .opt .L{background:var(--night-3);color:var(--moon-2)}
.deck.dark .opt.right{background:#0f3a1d}
.deck.dark .opt.wrong{background:#3d1412}
.qtop{display:flex;align-items:center;justify-content:center;gap:16px;width:100%}
.why{font-size:clamp(16px,1.7vw,22px);color:var(--ink-2);max-width:60ch;font-weight:500}
.deck.dark .why{color:var(--moon-2)}
.reveal-btn{font-size:16px;font-weight:600;color:var(--blue)}
.deck.dark .reveal-btn{color:var(--blue-2)}
.picker{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;animation:rise .6s var(--ease) both}
.picker .lab{font-size:14px;color:var(--ink-3);font-weight:500;width:100%}
.tp{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--mist);font-weight:600;font-size:16px;transition:all .3s var(--ease)}
.tp.on{background:var(--ink);color:#fff;transform:scale(1.04)}
.tp .plus{font-size:13px;opacity:.65;font-variant-numeric:tabular-nums}
.deck.dark .tp{background:var(--night-2)}
.deck.dark .tp.on{background:#fff;color:#000}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:rgba(120,120,128,.2)}
.ring .fg{stroke:currentColor;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.ring.end{color:var(--red)}
.ring.end{animation:bump .8s var(--ease)}

/* Special scenes */
.play{width:clamp(120px,15vw,180px);aspect-ratio:1;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:clamp(40px,5vw,60px);position:relative;box-shadow:0 26px 70px -24px rgba(255,46,84,.65);transition:transform .3s var(--ease)}
.play:hover{transform:scale(1.04)}
.play.on::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(255,46,84,.5);animation:ripple 1.2s ease-out infinite}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:100%;max-width:860px}

.scene .hl,.hero .hl{background-size:220% 100%;animation:shimmer 5s ease-in-out infinite alternate}
.trackin{animation:trackIn 1.6s var(--ease) both}
.shimmer,.hero h1.shimmer{background-size:220% 100%!important;animation:trackIn 1.6s var(--ease) both,shimmer 6s 1.6s ease-in-out infinite alternate}
.warpov{position:absolute;inset:0;z-index:3;background:#000;pointer-events:none;animation:warpov 1.5s var(--ease) both}
@keyframes warpov{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
.spin-in{animation:spinIn 1.8s var(--ease) both}
.chipwrap{position:relative;display:grid;place-items:center}
.shock{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;border:2px solid rgba(255,255,255,.6);opacity:0;animation:shock 2.2s var(--ease) both;pointer-events:none}
.chip3d .sheen{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.chip3d .sheen::before{content:"";position:absolute;top:-50%;left:-80%;width:50%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:rotate(20deg);animation:sheen 5.5s var(--sh,0s) ease-in-out infinite}
.chip3d.tilt{transition:transform .15s linear}
.float{animation:floaty 6s ease-in-out infinite}
.flydot{position:fixed;left:0;top:0;z-index:290;pointer-events:none;padding:6px 12px;border-radius:999px;color:#fff;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.02em;box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:nowrap}
.burstc{position:fixed;inset:0;pointer-events:none;z-index:285}
.opt.right{position:relative}
.opt.right::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 2px var(--green);animation:ringOut 1s var(--ease) both}
.ring.hurry{color:var(--red);animation:pulse .5s ease-in-out infinite alternate}
.marquee{background:#000;color:#3a3a3e;overflow:hidden;padding-block:18px 64px;display:flex;flex-direction:column;gap:6px}
.mq{display:flex;width:max-content;animation:marquee 60s linear infinite}
.mq.rev{animation-direction:reverse;animation-duration:70s}
.mq span{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,5vw,64px);letter-spacing:-.04em;white-space:nowrap;padding-right:.6em}
.mq span b{font-weight:700;background:var(--g-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.reveal{animation:revealUp linear both;animation-timeline:view();animation-range:entry 0% cover 28%}
.lcard::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.09),transparent 45%);z-index:0}
.step{transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.step:hover{transform:translateY(-6px);box-shadow:0 24px 50px -24px rgba(0,0,0,.25)}
.wipe{position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(#fbf5e6,#f2e5c9);animation:wipe 1.1s var(--ease) both}
.beams{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.beam{position:absolute;top:-10%;width:60vmax;height:130%;background:conic-gradient(from 180deg at 50% 0%,transparent 0deg,rgba(255,255,255,.10) 12deg,transparent 26deg);transform-origin:50% 0%;animation:sweep 7s ease-in-out infinite alternate}
.beam.l{left:-12vmax}
.beam.r{right:-12vmax;animation-delay:-3.5s;animation-direction:alternate-reverse}
.polaroid{rotate:var(--rot,0deg);transition:rotate .5s var(--ease),scale .5s var(--ease)}
.polaroid:hover{rotate:0deg;scale:1.03}
.spot{position:relative}
.spot::before{content:"";position:absolute;inset:-60px;background:radial-gradient(circle,rgba(255,214,10,.35),transparent 60%);z-index:-1;animation:rise 1s var(--ease) both}
.punch{position:absolute;width:12cqw;height:12cqw;border-radius:50%;border:.5cqw solid rgba(48,209,88,.9);transform:translate(-50%,-50%);animation:punch 1.2s var(--ease) both;pointer-events:none;z-index:3}
.drawcheck path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .8s .2s var(--ease) forwards}
.bin{transform-origin:bottom left;animation:bubbleIn .55s cubic-bezier(.2,1.4,.4,1) both!important}
.bout{transform-origin:bottom right;animation:bubbleIn .55s cubic-bezier(.2,1.4,.4,1) both!important}
.mono.flip{animation:flipIn 1s var(--ease) both}
.sweepring{position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(var(--c1,#2997ff),var(--c2,#a95cff),transparent 70%);-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%);animation:spin 1.2s linear infinite}

@keyframes rise{from{opacity:0;transform:translateY(28px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes sceneIn{from{opacity:0;transform:scale(1.045);filter:blur(16px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes sceneOut{to{opacity:0;transform:scale(.955);filter:blur(12px)}}
@keyframes wordUp{from{transform:translateY(110%) rotate(5deg);opacity:0}to{transform:none;opacity:1}}
@keyframes shimmer{from{background-position:0% 50%}to{background-position:100% 50%}}
@keyframes trackIn{from{letter-spacing:.35em;opacity:0;filter:blur(18px);transform:scale(1.08)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes spinIn{0%{transform:perspective(900px) rotateY(-540deg) scale(.3);opacity:0}60%{opacity:1}100%{transform:perspective(900px) rotateY(0) scale(1);opacity:1}}
@keyframes shock{0%{transform:scale(.2);opacity:.9}100%{transform:scale(4.2);opacity:0}}
@keyframes sheen{0%,60%{left:-80%}100%{left:140%}}
@keyframes floaty{50%{transform:translateY(-10px)}}
@keyframes ringOut{from{box-shadow:0 0 0 0 rgba(48,209,88,.7)}to{box-shadow:0 0 0 22px rgba(48,209,88,0)}}
@keyframes pulse{to{transform:scale(1.12)}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes revealUp{from{opacity:.25;transform:translateY(70px) scale(.96);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(8vmax,6vmax) scale(1.15)}100%{transform:translate(-6vmax,10vmax) scale(.9)}}
@keyframes wipe{from{clip-path:circle(0% at 50% 18%)}to{clip-path:circle(150% at 50% 18%)}}
@keyframes sweep{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes punch{0%{width:4cqw;height:4cqw;opacity:1}100%{width:26cqw;height:26cqw;opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes bubbleIn{from{opacity:0;transform:scale(.4) translateY(14px)}to{opacity:1;transform:none}}
@keyframes flipIn{from{transform:perspective(800px) rotateY(180deg) scale(.8)}to{transform:perspective(800px) rotateY(0) scale(1)}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes bump{30%{transform:scale(1.18)}}
@keyframes ripple{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.25}}
@keyframes shake{25%{transform:translate(calc(-50% - 6px),-50%)}75%{transform:translate(calc(-50% + 6px),-50%)}}
@keyframes floatup{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-60px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
